<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./public/output.css">
</head>
<body>
    <div>
        <nav class=" w-full h-fit font-bold text-3xl px-8 py-3 text-white flex items-center absolute justify-between bg-amber-600 border border-green-700 rounded-b-md">
            <h1 class="font-bold text-3xl">بهترین کتاب ها</h1>
            <a href="#" id="btn" class="bg-green-600  text-xl  rounded-md py-2.5 px-4">افزودن کتاب های جدید</a>
        </nav>
        <div class="w-full h-screen hidden justify-center items-center bg-gray-200 " id="form">
        <div class="w-[25%]  mt-16 p-3 bg-white mx-auto rounded-md h-[70%] shadow-2xl shadow-green-700">
            <h1 class="my-1 mx-auto flex text-transparent justify-center items-center bg-clip-text text-3xl  h-16 w-full font-bold bg-linear-40 from-green-400 to-black via-green-800">اضافه کردن کتاب</h1>
            <form class="flex flex-col gap-3">
                <div>
                <label for="name">نام کتاب</label>
            <input type="text" id="name" class="border outline-0 border-green-500 w-full h-9 rounded-md ">
            </div>
            <div>
                <label for="image">عکس کتاب</label>
            <input type="text" id="image" class="border outline-0 border-green-500 w-full h-9 rounded-md">
            </div>
            <div>
                <label for="des">توضیحات</label>
            <textarea name="" id="des" class="border outline-0 border-green-500 w-full resize-none h-20 rounded-md"></textarea>
            </div>
            <input 
            id="abtn"
            type="submit"
            value="اضافه کردن"
            class="bg-green-600 border mt- border-green-500 rounded-md  w-full mt-8 py-1.5 px-6 font-normal text-2xl text-center mx-auto"></input>
            </form>
        </div>
        </div>
        <div id="bookCon" class="flex  gap-3 items-center p-4 w-full  flex-col"></div>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
