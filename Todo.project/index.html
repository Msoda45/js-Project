<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
        *{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
.con{
    width: 100%;
    height: fit-content;
}
nav{
    width: 100%;
    background-color: lightslategray;
    height: fit-content;
    position: fixed;
    top:0;
    left: 0;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
nav> button{
    padding: 7px 20px;
    border-radius: 10px;
    border: none;
    background-color: white;
    color: lightslategray;
}
.con > div.coninputs {
    height: 100vh;
    width: 100%;
    display: none;
    justify-content: center;
    align-items: center;
}
.con > div.coninputs h1{
    text-align: center;
    margin: 20px auto;
    color: transparent;
    background-image: linear-gradient(80deg,  blue,lightblue);
    background-clip: text;
}
.con > div.coninputs >div.conadd{
    width: 60%;
    padding: 15px;
    border-radius: 9px;
    box-shadow: 9px 3px 20px rgba(0,0,0,0.2);
}
.con >div.toggle{
    display: flex;
}
form{
    display: flex;
    width: 100%;
    flex-direction: column;
    gap: 15px;
}
form > input,select{
    height: 33px;
    border-radius: 50px;
    border: 2px solid gray;
    text-align: left;
    padding-left: 13px;
    font-size: 15px;
    font-weight: 500;
}
form >button{
    padding: 6px;
    border-radius: 50px;
    background-image: linear-gradient(170deg, blue,lightblue,gray);
    font-weight: 500;
    font-size: 16px;
    border: 2px solid gray;
}
form >button:hover{
    transform:  translateY(-3px);
    transition: 1000ms;
}
div#parent{
    width: 100%;
    margin: 80px auto;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 9px;
}
div.red{
    background-color: red;
}
div.yellow{
    background-color: yellow;
}
div.green{
    background-color: green;
}
div.smallbox{
    height: 20px;
    width: 20px;
    border: 1px solid black;
    border-radius: 50%;
    margin: 9px 12px;
}
div.box{
    width: 60%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 12px;
    border: 1px solid black;
    border-radius: 9px;
}
     </style>
    <title>Document</title>
   
    <script src="app.js" defer></script>
</head>
<body>
    <nav>
        <h1>Todo App</h1>
        <button id="btn">Add Form</button>
    </nav>
    <div class="con" id="con">
        <div class="coninputs" id="coninputs">
        <div class="conadd">
            <h1>Add Todo</h1>
            <form action="">
                <input type="text" id="todo">
                <select id="importance">
                    <option value="important">Important</option>
                    <option value="normal">Normal</option>
                    <option value="optional">Optional</option>
                </select>
                <button id="savebtn">Save</button>
            </form>
        </div>
        </div>
        <div id="parent"></div>
    </div>
</body>
</html>
